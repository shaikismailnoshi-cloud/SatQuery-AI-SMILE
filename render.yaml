services:
  - type: web
    name: satquery-ai
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SATQUERY_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.12
