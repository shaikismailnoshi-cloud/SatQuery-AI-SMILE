services:
  - type: web
    name: satquery-ai
    runtime: python
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements-deploy.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SATQUERY_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SATQUERY_CLOUD_MODE
        value: "1"
